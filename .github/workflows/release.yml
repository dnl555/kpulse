name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Test
        run: go test ./... -race -count=1
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
      - name: Render kpulse.yaml
        run: VERSION=${{ github.ref_name }} ./deploy/render.sh > kpulse.yaml
      - name: Package and push Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          # Sync chart version + appVersion to the released git tag so users
          # who install via Helm get the matching image. Chart version must
          # be semver (no leading v); appVersion keeps the v so it matches
          # the published Docker image tag (ghcr.io/.../kpulse:v0.X.Y).
          sed -i "s/^version: .*/version: ${VERSION}/" charts/kpulse/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/kpulse/Chart.yaml
          helm package charts/kpulse
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          helm push "kpulse-${VERSION}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kpulse.yaml
            deploy/install.sh
            kpulse-*.tgz
