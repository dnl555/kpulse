name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - run: go test ./... -race -count=1
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Helm lint
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz
          ./linux-amd64/helm lint charts/kpulse \
            --set clusterName=ci \
            --set channels.slack.enabled=true \
            --set-string channels.secrets.SLACK_WEBHOOK_URL=https://example.com/x
  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t kpulse:ci .
