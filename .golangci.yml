version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        # We default to writing no comments. Don't demand docstrings on every export.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
