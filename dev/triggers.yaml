# Deliberately broken workloads, used to exercise kpulse alerts during local
# development. Apply with `tilt up` (this file is included automatically) or
# kubectl apply -f dev/triggers.yaml. Delete a workload to see the matching
# [RESOLVED] alert flow.
---
apiVersion: v1
kind: Namespace
metadata: { name: triggers }
---
# CrashLoopBackOff: exits 1 immediately
apiVersion: v1
kind: Pod
metadata: { name: crash, namespace: triggers }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "echo crashing && exit 1"]
  restartPolicy: Always
---
# ImagePullBackOff: image does not exist
apiVersion: v1
kind: Pod
metadata: { name: badimage, namespace: triggers }
spec:
  containers:
    - name: c
      image: ghcr.io/dnl555/this-image-does-not-exist:nope
---
# OOMKilled: allocates more than the limit
apiVersion: v1
kind: Pod
metadata: { name: oom, namespace: triggers }
spec:
  restartPolicy: Never
  containers:
    - name: c
      image: polinux/stress
      resources:
        requests: { memory: 32Mi }
        limits:   { memory: 64Mi }
      args: ["stress", "--vm", "1", "--vm-bytes", "200M", "--vm-hang", "0"]
---
# Job that fails so kpulse fires job_failed
apiVersion: batch/v1
kind: Job
metadata: { name: fail-job, namespace: triggers }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: c
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
