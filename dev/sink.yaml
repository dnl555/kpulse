---
apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: demo
  labels: { app: sink }
spec:
  replicas: 1
  selector: { matchLabels: { app: sink } }
  template:
    metadata: { labels: { app: sink } }
    spec:
      containers:
        - name: sink
          image: mendhak/http-https-echo:34
          env:
            - { name: HTTP_PORT, value: "8080" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: sink, namespace: demo }
spec:
  selector: { app: sink }
  ports: [{ port: 80, targetPort: 8080 }]
