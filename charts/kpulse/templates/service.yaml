apiVersion: v1
kind: Service
metadata:
  name: {{ include "kpulse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kpulse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "kpulse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
