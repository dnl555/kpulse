{{- /*
  This Secret is only rendered when channels.secrets is populated in values.
  When empty, we skip it so `helm upgrade` does not overwrite credentials
  that were set out-of-band via `kubectl -n <ns> patch secret kpulse-secrets`.
  Bootstrap on first install with:
    kubectl -n <ns> create secret generic kpulse-secrets \
      --from-literal=SLACK_WEBHOOK_URL=... \
      --from-literal=SMTP_USER=... --from-literal=SMTP_PASS=...
*/ -}}
{{- if .Values.channels.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kpulse.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.channels.secrets }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
